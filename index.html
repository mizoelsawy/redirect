<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Stenix</title>
<meta name="description" content="Download the Stenix app — iOS and Android.">
<meta name="color-scheme" content="light dark">

<!-- Social preview (swap the image when you have one) -->
<meta property="og:title" content="Get Stenix">
<meta property="og:description" content="Download the Stenix app — iOS and Android.">
<meta property="og:type" content="website">

<style>
  :root {
    --bg: #0b0d12;
    --bg-glow-a: #3b2bff;
    --bg-glow-b: #00c2a8;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #f4f6fb;
    --text-muted: #a3abbd;
    --btn-bg: #ffffff;
    --btn-text: #0b0d12;
    --btn-ghost-border: rgba(255, 255, 255, 0.2);
    --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7fb;
      --bg-glow-a: #c7c2ff;
      --bg-glow-b: #a8ead9;
      --card: rgba(255, 255, 255, 0.75);
      --card-border: rgba(15, 18, 30, 0.08);
      --text: #11141c;
      --text-muted: #5d6476;
      --btn-bg: #11141c;
      --btn-text: #ffffff;
      --btn-ghost-border: rgba(15, 18, 30, 0.15);
      --shadow: 0 24px 60px -24px rgba(15, 18, 30, 0.25);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 32px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ambient glow */
  body::before,
  body::after {
    content: "";
    position: fixed;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
  }
  body::before { background: var(--bg-glow-a); top: -20vmax; left: -15vmax; }
  body::after  { background: var(--bg-glow-b); bottom: -25vmax; right: -15vmax; }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 40px 28px 32px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
  }

  .app-icon {
    width: 84px;
    height: 84px;
    margin: 0 auto 22px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
    background: linear-gradient(135deg, #5b4bff, #00c2a8);
    box-shadow: 0 12px 30px -10px rgba(91, 75, 255, 0.6);
  }
  .app-icon img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }

  h1 {
    margin: 0 0 10px;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  p.sub {
    margin: 0 0 28px;
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--text-muted);
  }

  .actions { display: grid; gap: 12px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 20px;
    border: 0;
    border-radius: 16px;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--btn-text);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px rgba(0, 0, 0, 0.55); }
  .btn:active { transform: translateY(0) scale(0.99); }
  .btn:focus-visible { outline: 3px solid #5b4bff; outline-offset: 3px; }

  .btn svg { width: 20px; height: 20px; flex: 0 0 auto; }

  .btn--ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--btn-ghost-border);
  }

  .note {
    margin: 22px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }
  .note a { color: inherit; }

  [hidden] { display: none !important; }

  @media (max-width: 380px) {
    .card { padding: 32px 20px 26px; }
    h1 { font-size: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <!-- Replace the letter with <img src="icon.png" alt=""> when you have the app icon -->
    <div class="app-icon" aria-hidden="true">S</div>

    <h1>Get Stenix</h1>
    <p class="sub" id="sub">Tap below and we'll take you to the right store for your device.</p>

    <div class="actions">
      <!-- Single smart button: shown on phones -->
      <a class="btn" id="smartBtn" href="#" hidden>
        <span id="smartIcon" aria-hidden="true"></span>
        <span id="smartLabel">Download the app</span>
      </a>

      <!-- Both stores: shown on desktop / unknown devices -->
      <a class="btn" id="iosBtn" href="#" hidden>
        <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C62.5 141.2 8 184.6 8 271.2c0 25.6 4.7 52 14.1 79.3 12.5 35.9 54.4 123.9 98.1 122.6 22.9-.5 39-16.2 68.8-16.2 28.9 0 43.8 16.2 69.4 16.2 44.1-.6 82-80.6 93.9-116.6-59-27.8-33.6-86.8-33.6-87.8zM262 72.4c21.2-25.2 19.3-48.1 18.7-56.4-18.8 1.1-40.5 12.8-52.9 27.2-13.6 15.5-21.7 34.6-20 55.8 20.3 1.5 38.9-8.9 54.2-26.6z"/></svg>
        <span>Download on the App Store</span>
      </a>

      <a class="btn btn--ghost" id="androidBtn" href="#" hidden>
        <svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 65.5 65.7 65.5 60-34.1c18-14.3 18-46.5-1.1-62.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
        <span>Get it on Google Play</span>
      </a>
    </div>

    <p class="note" id="note" hidden>Nothing happened? <a id="fallbackLink" href="#">Open the store directly</a>.</p>
  </main>

<script src="app-link.js"></script>
<script>
(function () {
  "use strict";

  // Deep-link config lives in app-link.js — this file only drives the UI.
  var platform = AppLink.detect();

  var smartBtn   = document.getElementById("smartBtn");
  var smartLabel = document.getElementById("smartLabel");
  var smartIcon  = document.getElementById("smartIcon");
  var iosBtn     = document.getElementById("iosBtn");
  var androidBtn = document.getElementById("androidBtn");
  var sub        = document.getElementById("sub");
  var note       = document.getElementById("note");
  var fallback   = document.getElementById("fallbackLink");

  var APPLE_ICON = '<svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C62.5 141.2 8 184.6 8 271.2c0 25.6 4.7 52 14.1 79.3 12.5 35.9 54.4 123.9 98.1 122.6 22.9-.5 39-16.2 68.8-16.2 28.9 0 43.8 16.2 69.4 16.2 44.1-.6 82-80.6 93.9-116.6-59-27.8-33.6-86.8-33.6-87.8zM262 72.4c21.2-25.2 19.3-48.1 18.7-56.4-18.8 1.1-40.5 12.8-52.9 27.2-13.6 15.5-21.7 34.6-20 55.8 20.3 1.5 38.9-8.9 54.2-26.6z"/></svg>';
  var PLAY_ICON  = '<svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 65.5 65.7 65.5 60-34.1c18-14.3 18-46.5-1.1-62.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>';

  iosBtn.href = AppLink.config.iosStore;
  androidBtn.href = AppLink.config.androidStore;

  if (platform === "ios" || platform === "android") {
    var target = AppLink.resolve(platform);

    smartLabel.textContent = platform === "ios"
      ? "Download on the App Store"
      : "Get it on Google Play";
    smartIcon.innerHTML = platform === "ios" ? APPLE_ICON : PLAY_ICON;
    if (platform === "android") smartBtn.classList.add("btn--ghost");
    smartBtn.href = target.store;
    smartBtn.hidden = false;

    sub.textContent = platform === "ios"
      ? "Looks like you're on iPhone or iPad."
      : "Looks like you're on Android.";

    fallback.href = target.store;

    // Tapping the button always runs the full deep-link attempt
    smartBtn.addEventListener("click", function (e) {
      e.preventDefault();
      AppLink.open();
    });

    // ?auto=0 lets you view this page without being sent onward
    var auto = new URLSearchParams(window.location.search).get("auto");
    if (auto !== "0") {
      note.hidden = false;
      AppLink.open();
    }
  } else {
    sub.textContent = "Stenix is available on iOS and Android. Pick your store below.";
    iosBtn.hidden = false;
    androidBtn.hidden = false;
  }
})();
</script>
</body>
</html>
